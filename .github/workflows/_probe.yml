# Throwaway: does the pages.yml deploy gate evaluate true on a NON-fork?
name: probe
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: evaluate
        run: |
          set -eu
          raw="${{ github.event.repository.fork }}"
          echo "repository.fork raw   = [${raw}]"
          echo "is_fork_truthy        = ${{ github.event.repository.fork == true }}"
          # exactly the expression shipped in chess_clock pages.yml
          echo "current ref           = ${GITHUB_REF}"
          # The FORK half only: is the repo a fork? (the ref half is separate)
          if [ "${{ github.event.repository.fork }}" = "false" ]; then
            echo "::notice title=PROBE-OK::on a non-fork, repository.fork is false, so !fork is true -> deploy REACHABLE"
          else
            echo "::error title=PROBE-FAIL::unexpected"
          fi
          # The full shipped expression, evaluated on master this time
          if [ "${{ github.ref == 'refs/heads/master' && !github.event.repository.fork }}" = "true" ]; then
            echo "::notice title=PROBE-MASTER-OK::full gate is TRUE on master of a non-fork"
          else
            echo "::notice title=PROBE-MASTER-NO::full gate is false here (ref=$(git symbolic-ref --short HEAD 2>/dev/null || echo '?'))"
          fi
