[package]
name = "life-counter"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Private, browser-side 1-12 player life tracker for tabletop games"

[lib]
name = "life_counter"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
usvg = { version = "0.48", default-features = false }
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A caret, not an exact pin: `wasm-bindgen-futures`, `js-sys` and `web-sys`
# each depend on one exact `wasm-bindgen`, so `Cargo.lock` decides the version
# whichever way this line is written. The bindings generator must be that same
# version -- a mismatch fails at load time in the browser, not at compile time
# -- and the workflows read it from the lock rather than naming it.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# `WakeLockType` is required alongside `WakeLock`/`WakeLockSentinel`: `request()`
# takes a `WakeLockType` argument, and `VisibilityState` is what
# `Document::visibility_state` returns. `PointerEvent` is the one pointer event
# type used, and `DomTokenList` backs `Element::class_list`. `ServiceWorkerState`
# is how an installed-and-waiting worker is recognised before the page asks it
# in.
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "Node", "EventTarget", "Event", "PointerEvent",
  "DomTokenList", "CssStyleDeclaration",
  "HtmlElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlInputElement",
  "Navigator", "WakeLock", "WakeLockSentinel", "WakeLockType",
  "ServiceWorkerContainer", "ServiceWorkerRegistration",
  "ServiceWorker", "ServiceWorkerState", "RegistrationOptions", "Location",
  "Url",
  "Performance", "VisibilityState", "console"
] }

[lints.rust]
warnings = "deny"

[profile.release]
strip = true
lto = true
opt-level = "s"